plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.sixpm.scancamera'
version = '1.0.0'

android {
  namespace 'ai.sixpm.scancamera'
}

// CameraX needs the real ListenableFuture at compile time; React Native's Guava swaps in an empty
// one. expo-camera forces the same.
configurations.configureEach {
  resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
}

dependencies {
  // The CameraX expo-camera already carries, so the app ships one copy.
  def camerax = '1.6.0'
  implementation "androidx.camera:camera-core:${camerax}"
  implementation "androidx.camera:camera-camera2:${camerax}"
  implementation "androidx.camera:camera-lifecycle:${camerax}"
  implementation "androidx.camera:camera-view:${camerax}"
  implementation 'androidx.activity:activity-ktx:1.11.0'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'

  // ML Kit's bundled models: they work offline and on first launch, with nothing to download.
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
